# Smoke test de la capa 10: tráfico transaccional sintético (PII, falsos 5xx, errores ocultos en 2xx)
# enviado al agente de nodo, como lo haría una aplicación instrumentada.
apiVersion: v1
kind: Namespace
metadata:
  name: smoke-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: smoke-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traffic-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-generator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generator
          image: bancoplus/traffic-generator:poc
          imagePullPolicy: Never
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-node-agent.observability.svc.cluster.local:4317
            - name: TPS
              value: "30"
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534          # nobody: runAsNonRoot exige UID numérico
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
