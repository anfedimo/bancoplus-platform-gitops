apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slo-alerts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/anfedimo/bancoplus-platform-gitops.git
    targetRevision: main
    path: observability/slo-alerts
  destination:
    server: https://kubernetes.default.svc
    namespace: pagos
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
