# Collector por nodo (DaemonSet): contexto de Kubernetes y enrutamiento por traceID hacia el Gateway.
fullnameOverride: otel-node-agent
mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.162.0
command:
  name: otelcol-contrib

extraEnvs:
  - name: K8S_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName

# RBAC explícito: k8sattributes y resolver k8s del load_balancing
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: [pods, namespaces, nodes, endpoints]
      verbs: [get, list, watch]
    - apiGroups: [apps]
      resources: [replicasets, deployments]
      verbs: [get, list, watch]
    - apiGroups: [discovery.k8s.io]
      resources: [endpointslices]
      verbs: [get, list, watch]

# internalTrafficPolicy Local (default del chart en daemonset): cada pod envía al agente de su nodo
service:
  enabled: true

ports:
  jaeger-compact: { enabled: false }
  jaeger-thrift: { enabled: false }
  jaeger-grpc: { enabled: false }
  zipkin: { enabled: false }

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 256Mi }

alternateConfig:
  exporters:
    load_balancing:
      protocol:
        otlp:
          sending_queue:
            enabled: true
            queue_size: 2000
          tls:
            insecure: true
      resolver:
        k8s:
          ports:
          - 4317
          service: otel-gateway-headless.observability
      routing_key: traceID
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133
  processors:
    batch:
      send_batch_size: 512
      timeout: 2s
    k8s_attributes:
      auth_type: serviceAccount
      extract:
        metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.deployment.name
        - k8s.node.name
      filter:
        node_from_env_var: K8S_NODE_NAME
      pod_association:
      - sources:
        - from: resource_attribute
          name: k8s.pod.ip
      - sources:
        - from: connection
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 20
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  service:
    extensions:
    - health_check
    pipelines:
      traces:
        exporters:
        - load_balancing
        processors:
        - memory_limiter
        - k8s_attributes
        - batch
        receivers:
        - otlp
    telemetry:
      metrics:
        level: normal
        readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
