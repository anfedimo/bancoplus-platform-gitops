apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-legacy-standin
  labels:
    app.kubernetes.io/name: apm-legacy-standin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apm-legacy-standin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apm-legacy-standin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.22.0
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: ui, containerPort: 16686 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: 16686 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
