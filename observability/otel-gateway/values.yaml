# OTel Collector Gateway · semántica de negocio, PII en el borde, tail sampling, métricas RED, Dual-Shipping.
# Fuente de verdad de la configuración del Gateway en Kubernetes.
fullnameOverride: otel-gateway
mode: deployment
replicaCount: 2

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.162.0
command:
  name: otelcol-contrib

# PII_HASH_SALT y DT_API_TOKEN: Secret gestionado fuera de Git (External Secrets Operator + Secrets Manager)
extraEnvsFrom:
  - secretRef:
      name: otel-gateway-secrets

ports:
  jaeger-compact: { enabled: false }
  jaeger-thrift: { enabled: false }
  jaeger-grpc: { enabled: false }
  zipkin: { enabled: false }
  metrics: { enabled: true }
  red-metrics: { enabled: true, containerPort: 8889, servicePort: 8889, protocol: TCP }

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 768Mi }

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Scrape por pod: con N réplicas, un scrape al Service perdería las métricas RED de las demás
serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: metrics
    - port: red-metrics

# Service headless para el resolver k8s del exporter load_balancing de los agentes de nodo
extraManifests:
  - apiVersion: v1
    kind: Service
    metadata:
      name: otel-gateway-headless
    spec:
      clusterIP: None
      selector:
        app.kubernetes.io/name: opentelemetry-collector
        app.kubernetes.io/instance: otel-gateway
      ports:
        - name: otlp
          port: 4317
          targetPort: 4317

alternateConfig:
  connectors:
    # Log-to-Metrics en el Edge: el log crudo no sale del Gateway, solo su conteo
    count:
      logs:
        app.log.errors:
          attributes:
          - key: service.name
          conditions:
          - severity_number >= SEVERITY_NUMBER_ERROR
          description: Registros de log con severidad ERROR o superior por servicio
        app.log.records:
          attributes:
          - key: service.name
          description: Registros de log recibidos por servicio
    forward/sampling: {}
    span_metrics:
      dimensions:
      - name: service.version
      - name: business.outcome
      - name: http.response.status_code
      - name: payment.channel
      histogram:
        explicit:
          buckets:
          - 50ms
          - 100ms
          - 250ms
          - 500ms
          - 800ms
          - 1s
          - 2s
          - 5s
      metrics_flush_interval: 15s
  exporters:
    otlp_grpc/backend-otel:
      endpoint: tempo.observability.svc.cluster.local:4317
      retry_on_failure:
        enabled: true
      sending_queue:
        enabled: true
        queue_size: 5000
      tls:
        insecure: true
    otlp_http/dynatrace:
      endpoint: http://apm-legacy-standin.observability.svc.cluster.local:4318
      headers:
        Authorization: Api-Token ${env:DT_API_TOKEN}
      retry_on_failure:
        enabled: true
      sending_queue:
        enabled: true
        queue_size: 5000
    prometheus:
      endpoint: 0.0.0.0:8889
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133
  processors:
    # El connector count emite deltas por lote; Prometheus requiere contadores acumulados
    deltatocumulative: {}
    batch:
      send_batch_size: 1024
      timeout: 5s
    filter/probes:
      error_mode: ignore
      traces:
        span:
        - attributes["http.route"] != nil and IsMatch(attributes["http.route"], "^/(actuator/health|healthz|readyz|livez|health)")
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 20
    tail_sampling:
      decision_cache:
        sampled_cache_size: 100000
      decision_wait: 10s
      expected_new_traces_per_sec: 1000
      num_traces: 100000
      policies:
      - name: retener-errores
        status_code:
          status_codes:
          - ERROR
        type: status_code
      - latency:
          threshold_ms: 800
        name: retener-lentas
        type: latency
      - name: retener-alto-valor
        numeric_attribute:
          key: payment.amount
          max_value: 9999999999999
          min_value: 50000000
        type: numeric_attribute
      - name: retener-anomalias
        string_attribute:
          key: payment.anomaly
          values:
          - "true"
        type: string_attribute
      - name: linea-base-exitosas
        probabilistic:
          sampling_percentage: 5
        type: probabilistic
    transform/business-semantics:
      error_mode: ignore
      trace_statements:
      - context: span
        statements:
        - set(attributes["business.operation"], attributes["http.response.header.x-business-operation"][0])
          where attributes["http.response.header.x-business-operation"] != nil
        - set(attributes["business.outcome"], attributes["http.response.header.x-business-outcome"][0])
          where attributes["http.response.header.x-business-outcome"] != nil
        - set(attributes["business.reason"], attributes["http.response.header.x-business-reason"][0])
          where attributes["http.response.header.x-business-reason"] != nil
        - delete_matching_keys(attributes, "^http\\.response\\.header\\.x-business-.*")
        - set(attributes["business.status_reclassified"], "declined_as_5xx") where attributes["business.outcome"]
          == "declined" and status.code == STATUS_CODE_ERROR
        - set(status.code, STATUS_CODE_UNSET) where attributes["business.status_reclassified"]
          == "declined_as_5xx"
        - set(attributes["business.status_reclassified"], "failed_as_2xx") where attributes["business.outcome"]
          == "failed" and status.code != STATUS_CODE_ERROR
        - set(status.code, STATUS_CODE_ERROR) where attributes["business.status_reclassified"]
          == "failed_as_2xx"
        - set(status.message, Concat(["business.reason=", attributes["business.reason"]],
          "")) where attributes["business.status_reclassified"] == "failed_as_2xx"
        - set(attributes["business.amount_band"], "bajo") where attributes["payment.amount"]
          != nil and attributes["payment.amount"] < 1000000
        - set(attributes["business.amount_band"], "medio") where attributes["payment.amount"]
          != nil and attributes["payment.amount"] >= 1000000 and attributes["payment.amount"]
          < 50000000
        - set(attributes["business.amount_band"], "alto") where attributes["payment.amount"]
          != nil and attributes["payment.amount"] >= 50000000
    transform/pii:
      error_mode: ignore
      trace_statements:
      - context: span
        statements:
        - set(attributes["account.number"], SHA256(Concat([attributes["account.number"],
          "${env:PII_HASH_SALT}"], ""))) where attributes["account.number"] != nil
        - set(attributes["customer.document"], SHA256(Concat([attributes["customer.document"],
          "${env:PII_HASH_SALT}"], ""))) where attributes["customer.document"] != nil
        - delete_matching_keys(attributes, "(?i)(^|[._])(cvv|cvc|pin|password|passwd|secret|token|authorization)($|[._])")
        - replace_all_patterns(attributes, "value", "\\b\\d{4}[ -]?\\d{4}[ -]?\\d{4}[
          -]?(\\d{4})\\b", "****-****-****-$$1")
        - replace_all_patterns(attributes, "value", "\\b3[47]\\d{2}[ -]?\\d{6}[ -]?(\\d{5})\\b",
          "****-******-$$1")
        - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+(@|%40)[A-Za-z0-9.-]+\\.[A-Za-z]{2,}",
          "[EMAIL_REDACTADO]")
        - replace_all_patterns(attributes, "value", "\\b\\d{6,12}\\b", "[NUM_REDACTADO]")
        - replace_pattern(name, "\\b\\d{6,19}\\b", "{id}")
      - context: spanevent
        statements:
        - replace_all_patterns(attributes, "value", "\\b\\d{4}[ -]?\\d{4}[ -]?\\d{4}[
          -]?(\\d{4})\\b", "****-****-****-$$1")
        - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+(@|%40)[A-Za-z0-9.-]+\\.[A-Za-z]{2,}",
          "[EMAIL_REDACTADO]")
        - replace_all_patterns(attributes, "value", "\\b\\d{6,12}\\b", "[NUM_REDACTADO]")
      - context: resource
        statements:
        - delete_matching_keys(attributes, "(?i).*(password|secret|token).*")
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  service:
    extensions:
    - health_check
    pipelines:
      logs/ingest:
        exporters:
        - count
        processors:
        - memory_limiter
        receivers:
        - otlp
      metrics/logs:
        exporters:
        - prometheus
        processors:
        - deltatocumulative
        - batch
        receivers:
        - count
      metrics/red:
        exporters:
        - prometheus
        processors:
        - batch
        receivers:
        - span_metrics
      traces/export:
        exporters:
        - otlp_http/dynatrace
        - otlp_grpc/backend-otel
        processors:
        - tail_sampling
        - batch
        receivers:
        - forward/sampling
      traces/ingest:
        exporters:
        - span_metrics
        - forward/sampling
        processors:
        - memory_limiter
        - filter/probes
        - transform/business-semantics
        - transform/pii
        receivers:
        - otlp
    telemetry:
      metrics:
        level: detailed
        readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
