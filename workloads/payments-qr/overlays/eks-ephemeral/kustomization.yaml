# EKS (Graviton): imagen desde ECR y programación en nodos arm64.
# Promoción: el pipeline de bancoplus-payments-qr publica :<commit-sha>; se actualiza newTag por PR.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  - ../../hooks
images:
  - name: payments-qr
    newName: 512943205201.dkr.ecr.us-east-1.amazonaws.com/bancoplus/payments-qr
    newTag: 7d4b0132707cbe104657e5b490b88eacfce3a7a4 # bancoplus-payments-qr@7d4b013 · CI run 37986643702
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/arch: arm64
