apiVersion: apps/v1
kind: Deployment
metadata:
  name: convenios-api
  namespace: pagos
  labels:
    app.kubernetes.io/name: convenios-api
    team: tribu-pagos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: convenios-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: convenios-api
        team: tribu-pagos
    spec:
      serviceAccountName: payments-qr
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: convenios-api
          image: payments-qr # resuelto por cada overlay (images)
          ports:
            - containerPort: 8080
          env:
            # Dimensionamiento del JVM según el contenedor; JAVA_TOOL_OPTIONS lo gestiona el Operator
            - name: JDK_JAVA_OPTIONS
              value: -XX:ActiveProcessorCount=2 -XX:MaxRAMPercentage=75
            # Simulación de indisponibilidad de una entidad de recaudo externa (HTTP 500 a sus recaudos)
            - name: CONVENIOS_EN_FALLA
              value: ELECTROPLUS
          # Sin límite de CPU: el agente instrumenta bytecode en el arranque
          resources:
            requests: { cpu: 100m, memory: 320Mi }
            limits: { memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
